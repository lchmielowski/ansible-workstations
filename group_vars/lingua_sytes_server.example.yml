---
# Example values only. Copy this file to lingua_sytes_server.yml and set your own values.

# Lingua Sytes Main Container Configuration
# Docker build path for the main application container
docker_build_path_main: "/home/fedora/PycharmProjects/lingua-sytes/"
docker_container_name_main: "lingua-app-main"
docker_image_name_main: "lingua-app-main"
docker_image_tag: "latest"
docker_ports_main:
  - "8080:8080"
docker_volumes_main:
  - "/data/app:/app/data"
  - "/data/logs:/app/logs"

# Application environment variables (required for the main container)
# Define secrets here that are specific to this environment
docker_env_vars_main:
  ENV: "production"
  DEBUG: "false"
  DATA_SQLALCHEMY_DATABASE_URI: "postgresql://user:password@host/dbname"
  AUTH_SQLALCHEMY_DATABASE_URI: "postgresql://user:password@host/auth_dbname"
  APP_SECRET_KEY: "change-me-to-a-secure-random-string"
  GOOGLE_API_KEY: "your-google-api-key"
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  GOOGLE_WEB_CLIENT_ID_FOR_ANDROID: "your-android-client-id"

# Lingua Sytes Nginx Container Configuration
docker_build_path_nginx: "/opt/docker-builds/lingua-sytes"
docker_container_name_nginx: "lingua-app-nginx"
docker_image_name_nginx: "lingua-app-nginx"
docker_volumes_nginx:
  - "/data/app:/app/data"
docker_build_files_nginx:
  - nginx.conf
  - lingua.sytes.net.crt
  - lingua.sytes.net.key
