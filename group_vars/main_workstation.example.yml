---
# Example values only. Copy this file to main_workstation.yml and set your own secrets.

smb_data_username: "example_user"
smb_data_password: "CHANGE_ME"
# Optional: set this for AD/domain-authenticated SMB servers.
smb_data_domain: "WORKGROUP"
smb_data_address: "samba.example.com"
smb_data_share: "data"

smb_photos_username: "example_photos_user"
smb_photos_password: "CHANGE_ME"
smb_photos_address: "photos.example.com"
smb_photos_share: "photos"

postgres_username: "postgres"
postgres_password: "CHANGE_ME"
postgres_database: "postgres"
container_name: "postgrescontainer"
backup_encrypted_path: "/path/to/your/sql_backup.sql.fernet"
decrypted_backup_path: "/tmp/sql_backup_tmp.sql"
fernet_key_file_path: "/path/to/your/fernet_key.txt"
image_name: "docker.io/postgres:17.8-alpine3.23"
