---
docker_container_name: "lingua-app-main"
docker_build_path: "/home/fedora/PycharmProjects/lingua-sytes/"
docker_image_name: "lingua-app-main"
docker_image_tag: "latest"
docker_ports:
  - "8080:8080"
docker_volumes:
  - "/data/app:/app/data"
  - "/data/logs:/app/logs"
docker_env_vars: {}
# Required application environment variables for the container.
# Define them in host/group vars, not here, because they may contain secrets.
# Example structure:
# docker_env_vars:
#   ENV: "production"
#   DEBUG: "false"
#   DATA_SQLALCHEMY_DATABASE_URI: "postgresql://user:password@host/dbname"
#   AUTH_SQLALCHEMY_DATABASE_URI: "postgresql://user:password@host/dbname"
#   APP_SECRET_KEY: "change-me"
#   GOOGLE_API_KEY: "..."
#   GOOGLE_CLIENT_ID: "..."
#   GOOGLE_CLIENT_SECRET: "..."
#   GOOGLE_WEB_CLIENT_ID_FOR_ANDROID: "..."
docker_build_files: []
# Container runtime - docker for Debian, podman for Fedora
container_runtime: "{{ 'podman' if ansible_facts['os_family'] == 'RedHat' else 'docker' }}"
