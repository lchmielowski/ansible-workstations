---
- name: Ensure project directory exists
  file:
    path: "{{ kibana_apm_project_path }}"
    state: directory
    mode: '0755'
  become: true
  become_method: ansible.builtin.sudo

- name: Copy docker-compose file
  copy:
    src: docker-compose.yml
    dest: "{{ kibana_apm_project_path }}/docker-compose.yml"
    mode: '0644'
  become: true
  become_method: ansible.builtin.sudo

- name: Deploy systemd service for kibana/apm stack
  template:
    src: kibana-apm-stack.service.j2
    dest: /etc/systemd/system/kibana-apm-stack.service
    mode: '0644'
  become: true
  become_method: ansible.builtin.sudo

- name: Ensure container runtime is available
  ansible.builtin.package:
    name: "{{ kibana_container_runtime }}"
    state: latest
  become: true
  become_method: ansible.builtin.sudo
  when: kibana_container_runtime == "podman"

- name: Ensure Podman Compose CLI is installed
  ansible.builtin.package:
    name: podman-compose
    state: latest
  become: true
  become_method: ansible.builtin.sudo
  when: kibana_container_runtime == "podman"

- name: Deploy kibana/apm stack with Docker Compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ kibana_apm_project_path }}"
    state: latest
    docker_cli: "{{ kibana_container_cli }}"
  become: true
  become_method: ansible.builtin.sudo
  when: kibana_container_runtime == "docker"

- name: Deploy kibana/apm stack with Podman Compose
  ansible.builtin.command:
    cmd: "{{ kibana_compose_up_cmd }}"
    chdir: "{{ kibana_apm_project_path }}"
  register: kibana_apm_compose
  changed_when: "'Creating' in kibana_apm_compose.stdout or 'Pulling' in kibana_apm_compose.stdout or 'Starting' in kibana_apm_compose.stdout"
  become: true
  become_method: ansible.builtin.sudo
  when: kibana_container_runtime == "podman"

- name: Ensure kibana/apm stack starts on boot and is running
  ansible.builtin.systemd_service:
    name: kibana-apm-stack
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_method: ansible.builtin.sudo
