---
kibana_apm_project_path: /opt/kibana-apm
kibana_container_runtime: "{{ container_runtime | default('podman' if ansible_facts['os_family'] == 'RedHat' else 'docker') }}"
kibana_container_cli: "{{ '/usr/bin/podman' if kibana_container_runtime == 'podman' else '/usr/bin/docker' }}"
kibana_container_service: "{{ 'podman.socket' if kibana_container_runtime == 'podman' else 'docker.service' }}"
kibana_compose_up_cmd: "{{ '/usr/bin/docker compose up --detach --remove-orphans' if kibana_container_runtime == 'docker' else '/usr/bin/podman-compose up -d --remove-orphans' }}"
kibana_compose_stop_cmd: "{{ '/usr/bin/docker compose stop' if kibana_container_runtime == 'docker' else '/usr/bin/podman-compose stop' }}"
